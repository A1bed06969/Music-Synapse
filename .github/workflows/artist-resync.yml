name: Artist catalog resync

on:
  # 2026-09-17時点で一時停止中: メンバー/クレジット/相関図まわりのデータ取り込みを
  # 優先順位から一旦外す方針としたため(アーティスト/アルバム/トラックの純カタログ
  # 整備を優先)。再開する場合はこのscheduleのコメントを外す。
  # 毎月1日・15日の 03:00 UTC (日本時間 12:00)
  # schedule:
  #   - cron: '0 3 1,15 * *'
  workflow_dispatch: {}

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Resync all artists
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: npx tsx scripts/resync-all-artists.ts

      - name: Backfill album edition groups
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/backfill-album-edition-groups.ts

      - name: Backfill album credits
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: npx tsx scripts/backfill-album-credits.ts
