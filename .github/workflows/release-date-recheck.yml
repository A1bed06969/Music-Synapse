name: Release date recheck

# 2026-09-18の本番Supabase障害・復旧断念(ローカル専用運用へ完全移行)に伴い、
# 定期実行を無効化した。有効だった当時は接続先の本番プロジェクトが既に無いため、
# 動かしたままだと毎日失敗し続けるだけになる(refresh-news.ymlと同じ理由・同じ対応)。
# 手動実行(workflow_dispatch)は残してあるので、本番運用を再開する場合は
# scheduleのコメントを外せば復帰できる。
on:
  # schedule:
  #   # 毎日 03:00 UTC (日本時間 12:00)
  #   - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Recheck released stub albums
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/recheck-released-stubs.ts
